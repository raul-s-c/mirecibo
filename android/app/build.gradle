apply plugin: 'com.android.application'

def envOrProperty = { String name, String fallback = null ->
    def value = project.findProperty(name) ?: System.getenv(name)
    return value ? value.toString() : fallback
}
def testAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def testAdMobBannerId = 'ca-app-pub-3940256099942544/9214589741'
def adMobAppId = envOrProperty('MIRECIBO_ADMOB_APP_ID', testAdMobAppId)
def adMobBannerId = envOrProperty('MIRECIBO_ADMOB_BANNER_ID', testAdMobBannerId)
def keystorePath = envOrProperty('MIRECIBO_KEYSTORE_PATH')
def keystorePassword = envOrProperty('MIRECIBO_KEYSTORE_PASSWORD')
def keyAliasName = envOrProperty('MIRECIBO_KEY_ALIAS')
def keyPasswordValue = envOrProperty('MIRECIBO_KEY_PASSWORD')
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseRequested) {
    if (adMobAppId == testAdMobAppId || adMobBannerId == testAdMobBannerId) {
        throw new GradleException('La compilación Play necesita MIRECIBO_ADMOB_APP_ID y MIRECIBO_ADMOB_BANNER_ID reales.')
    }
    if (!keystorePath || !keystorePassword || !keyAliasName || !keyPasswordValue) {
        throw new GradleException('La compilación Play necesita las cuatro variables MIRECIBO_KEYSTORE_* de firma.')
    }
}

android {
    namespace = "es.mirecibo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "es.mirecibo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "0.13.0"
        manifestPlaceholders = [admobAppId: adMobAppId]
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${adMobBannerId}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
